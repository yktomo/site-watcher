name: Scheduled Check

on:
  schedule:
    # Every 5 minutes. Public repo = unlimited free GitHub-hosted Actions minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scheduled-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser + OS dependencies
        # OS packages (--with-deps) aren't cacheable since the VM is fresh each run;
        # the browser binary download itself is skipped automatically when the
        # cache above already has it.
        run: playwright install --with-deps chromium

      - name: Run watcher
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          REQUEST_TIMEOUT: '40'
          EMAIL_ENABLED: 'false'
          PLAYWRIGHT_HEADLESS: 'true'
          LINE_ENABLED: 'true'
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python watcher.py --once

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
